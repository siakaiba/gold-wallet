<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Investment Wallet V2.4.8</title>
    <link rel="icon" type="image/png" href="https://static.vecteezy.com/system/resources/previews/063/053/951/non_2x/gold-wallet-dollar-icon-3d-glossy-golden-wallet-with-dollar-symbol-and-metallic-shine-for-money-finance-spending-and-online-payment-concepts-png.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ca8a04; border-radius: 10px; }
        
        /* Fix for scrollable section only */
        body, html { height: 100%; overflow: hidden; }
        
        .price-up { filter: drop-shadow(0 0 4px #10b981); transition: all 0.5s ease; }
        .price-down { filter: drop-shadow(0 0 4px #ef4444); transition: all 0.5s ease; }
        
        #loadingScreen { 
            position: fixed; inset: 0; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background-color: #111827; transition: opacity 0.6s ease-out, visibility 0.6s; 
        }
        .progress-container { width: 240px; height: 4px; background: #374151; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ca8a04, #facc15); width: 0%; transition: width 2s ease-in-out; }
        .tv-widget-container { height: 180px; width: 100%; border-radius: 8px; overflow: hidden; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans text-gray-900 dark:text-gray-100 transition-colors duration-300 flex flex-col h-screen">

    <!-- Loading & Password Screen -->
    <div id="loadingScreen">
        <div id="authContainer" class="flex flex-col items-center">
            <h2 class="text-yellow-500 font-bold tracking-widest uppercase text-sm mb-6">Security Check</h2>
            <input type="password" id="appPassword" placeholder="Enter Password" 
                class="bg-gray-800 border border-gray-600 text-white text-center p-3 rounded-lg outline-none focus:border-yellow-500 transition-all w-64 mb-4">
            <button onclick="checkPassword()" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-8 rounded-lg transition-all uppercase text-xs tracking-widest">Access Wallet</button>
            <p id="authError" class="text-red-500 text-[10px] mt-4 uppercase hidden">Incorrect Password</p>
        </div>
        
        <div id="syncLoader" class="hidden flex flex-col items-center">
            <h2 class="text-yellow-500 font-bold tracking-widest uppercase text-sm animate-pulse">Syncing Wallet Data</h2>
            <div class="progress-container">
                <div id="loaderBar" class="progress-bar"></div>
            </div>
        </div>
    </div>
    
    <!-- Main Dashboard -->
    <div id="mainDashboard" class="max-w-[98%] mx-auto w-full flex flex-col h-screen p-0 mt-[5px]">
        
        <header class="bg-yellow-600 text-white rounded-t-xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4 shrink-0 px-6 py-2">
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-bold uppercase tracking-tight">Gold Wallet</h1>
                    <span class="text-[10px] font-black bg-yellow-700/50 px-2 py-0.5 rounded shadow-sm self-center mt-1">V2.4.8</span>
                </div>
                <div class="text-[9px] md:text-[11px] flex flex-wrap gap-x-6 gap-y-1 mt-1 opacity-95 uppercase tracking-wider items-center">
                    <p>24K: <span id="display24K">--</span></p>
                    <p>22K: <span id="display22K">--</span></p>
                    <p>21K: <span id="display21K">--</span></p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <select id="currencySelector" onchange="changeCurrency()" class="bg-yellow-800/40 text-white text-[10px] font-bold border border-yellow-500/20 rounded-lg h-9 px-2 outline-none no-pdf cursor-pointer">
                    <option value="USD">USD</option>
                    <option value="QAR">QAR</option>
                </select>
                <button onclick="toggleTheme()" class="bg-yellow-800/40 p-2 rounded-lg border border-yellow-500/20 text-[10px] font-bold no-pdf uppercase">Toggle Theme</button>
                <button onclick="downloadPDF()" class="bg-white text-yellow-700 px-4 h-9 rounded-lg font-bold shadow-sm text-[10px] uppercase no-pdf">Download</button>
            </div>
        </header>

        <!-- Stats Section (Fixed) -->
        <div id="statsContainer" class="grid grid-cols-1 md:grid-cols-5 bg-white dark:bg-gray-800 border-x dark:border-gray-700 p-4 gap-3 border-b text-center shrink-0">
            <div class="bg-gray-50 dark:bg-gray-700 p-3 rounded-lg border dark:border-gray-600">
                <p class="text-[9px] text-gray-500 uppercase font-bold">Purchases</p>
                <p id="statCount" class="text-lg font-black">0</p>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700 p-3 rounded-lg border dark:border-gray-600">
                <p class="text-[9px] text-gray-500 uppercase font-bold">Total Weight</p>
                <p id="statGrams" class="text-lg font-black">0.00g</p>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700 p-3 rounded-lg border dark:border-gray-600">
                <p class="text-[9px] text-gray-500 uppercase font-bold">Invested</p>
                <p id="statInvested" class="text-lg font-black">--</p>
            </div>
            <div id="cardProfit" class="bg-gray-50 dark:bg-gray-700 p-3 rounded-lg border text-center">
                <p class="text-[9px] text-gray-500 uppercase font-bold">Profit/Loss</p>
                <p id="statProfit" class="text-lg font-black">--</p>
            </div>
            <div id="cardValue" class="bg-gray-50 dark:bg-gray-700 p-3 rounded-lg border text-center">
                <p class="text-[9px] text-gray-500 uppercase font-bold">Market Value</p>
                <p id="statValue" class="text-lg font-black">--</p>
            </div>
        </div>

        <!-- Charts Section (Fixed) -->
        <div id="chartsContainer" class="grid grid-cols-1 lg:grid-cols-3 bg-white dark:bg-gray-800 border-x dark:border-gray-700 p-4 gap-6 border-b shrink-0">
            <div class="h-[150px]"><canvas id="walletBehaviorChart"></canvas></div>
            <div class="h-[150px] border-l dark:border-gray-700 px-4"><canvas id="weightBarChart"></canvas></div>
            <div id="tradingview_widget" class="tv-widget-container"></div>
        </div>

        <!-- Input Section (Fixed) -->
        <div class="bg-white dark:bg-gray-800 p-4 border-x dark:border-gray-700 shrink-0 no-pdf">
            <div class="grid grid-cols-1 md:grid-cols-6 gap-3">
                <input type="date" id="purchaseDate" class="border dark:border-gray-600 p-2 rounded text-xs dark:bg-gray-700">
                <select id="purity" class="border dark:border-gray-600 p-2 rounded text-xs dark:bg-gray-700">
                    <option value="24">24K</option><option value="22">22K</option><option value="21">21K</option>
                </select>
                <input type="number" id="grams" placeholder="Grams" class="border dark:border-gray-600 p-2 rounded text-xs dark:bg-gray-700">
                <input type="number" id="price" placeholder="Price/g" class="border dark:border-gray-600 p-2 rounded text-xs dark:bg-gray-700">
                <input type="number" id="costs" placeholder="Making/g" class="border dark:border-gray-600 p-2 rounded text-xs dark:bg-gray-700">
                <button onclick="addEntry()" class="bg-yellow-600 text-white h-9 rounded font-bold uppercase text-[10px]">Add Entry</button>
            </div>
        </div>

        <!-- Table Section (ONLY SCROLLABLE PART) -->
        <div class="flex-grow bg-white dark:bg-gray-800 shadow-md border-x border-b dark:border-gray-700 overflow-hidden flex flex-col mb-2 rounded-b-xl">
            <div class="overflow-y-auto custom-scrollbar h-full">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 uppercase font-bold text-[9px] sticky top-0 z-10">
                        <tr>
                            <th class="p-3 border-b dark:border-gray-600">Date</th>
                            <th class="p-3 border-b dark:border-gray-600">Type</th>
                            <th class="p-3 border-b dark:border-gray-600 text-center">Weight</th>
                            <th class="p-3 border-b dark:border-gray-600 text-center">Unit Price</th>
                            <th class="p-3 border-b dark:border-gray-600 text-center">Total Paid</th>
                            <th class="p-3 border-b dark:border-gray-600 text-center">Current Value</th>
                            <th class="p-3 border-b dark:border-gray-600 text-center">Profit</th>
                            <th class="p-3 border-b dark:border-gray-600 text-center no-pdf">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="goldTable" class="dark:text-gray-300"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const DB_URL = "https://samirgoldwallet-default-rtdb.firebaseio.com/entries.json";
        const SOURCE_URL = "https://www.livepriceofgold.com/Qatar-gold-price.html";
        
        // Auth Logic
        function checkPassword() {
            const pass = document.getElementById('appPassword').value;
            if (pass === "siakaiba") {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('syncLoader').classList.remove('hidden');
                document.getElementById('loaderBar').style.width = '100%';
                
                // Complete App initialization
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.opacity = '0';
                    document.getElementById('loadingScreen').style.visibility = 'hidden';
                    initializeApp();
                }, 2000);
            } else {
                const err = document.getElementById('authError');
                err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 2000);
            }
        }

        // Dashboard Init
        function initializeApp() {
            fetchEntries();
            fetchGoldFlow();
            setInterval(fetchGoldFlow, 60000);
        }

        // Placeholder for existing logic (fetchEntries, fetchGoldFlow, etc.)
        // Add your previous JS logic here for DB interactions and Charts.
    </script>
</body>
</html>
