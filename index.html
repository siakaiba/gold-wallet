<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold Investment Wallet V2.4.7</title>
    
    <link rel="icon" type="image/png" href="https://static.vecteezy.com/system/resources/previews/063/053/951/non_2x/gold-wallet-dollar-icon-3d-glossy-golden-wallet-with-dollar-symbol-and-metallic-shine-for-money-finance-spending-and-online-payment-concepts-png.png">
 
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ca8a04; border-radius: 10px; }
        
        body, html { overflow: hidden; height: 100%; position: fixed; width: 100%; }

        .price-up { filter: drop-shadow(0 0 4px #10b981); transition: all 0.5s ease; }
        .price-down { filter: drop-shadow(0 0 4px #ef4444); transition: all 0.5s ease; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        #loadingScreen { 
            position: fixed; inset: 0; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background-color: #111827; transition: opacity 0.6s ease-out, visibility 0.6s; 
        }
        .loader-text-pulse { animation: pulse-gold-text 2s infinite; }
        @keyframes pulse-gold-text { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.98); } }
        .progress-container { width: 200px; height: 4px; background: #374151; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ca8a04, #facc15); width: 0%; transition: width 4s linear; }
        
        .status-flash { animation: live-flash 2s infinite; }
        @keyframes live-flash { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } }
        .dark .theme-slider-bg { transform: translateX(100%); }
        .tv-widget-container { height: 180px; width: 100%; border-radius: 8px; overflow: hidden; }
        
        #passwordArea { display: none; flex-direction: column; align-items: center; margin-top: 20px; }
        #passInput { background: #1f2937; border: 1px solid #374151; color: white; padding: 12px; border-radius: 8px; outline: none; text-align: center; letter-spacing: 4px; font-size: 16px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans text-gray-900 dark:text-gray-100 h-screen flex flex-col">

    <div id="loadingScreen">
        <h2 id="loaderTitle" class="text-yellow-500 font-bold tracking-widest uppercase text-xs loader-text-pulse text-center px-4">Syncing Wallet Data</h2>
        <div id="pContainer" class="progress-container">
            <div id="loaderBar" class="progress-bar"></div>
        </div>
        <div id="passwordArea">
            <p class="text-gray-400 text-[10px] uppercase mb-2 tracking-widest">Access Required</p>
            <input type="password" id="passInput" placeholder="••••••••" oninput="checkPass(this.value)">
            <p id="passError" class="text-red-500 text-[10px] mt-2 uppercase hidden">Invalid Access Key</p>
        </div>
        <p id="loaderSub" class="text-gray-500 text-[10px] mt-4 uppercase opacity-50">Syncing Market Prices</p>
    </div>
    
    <!-- iPhone Layout Fix: min-h-[100dvh] for Safari toolbars -->
    <div id="mainDashboard" class="max-w-full md:max-w-[98%] mx-auto w-full flex flex-col flex-grow bg-gray-100 dark:bg-gray-900 overflow-hidden min-h-[100dvh]">
        
        <header class="bg-yellow-600 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-2 shrink-0 px-4 md:px-6 py-2">
            <div class="flex flex-col items-center md:items-start">
                <div class="flex items-center gap-2">
                    <h1 class="text-lg md:text-2xl font-bold uppercase tracking-tight">Gold Wallet</h1>
                    <span class="text-[8px] font-black bg-yellow-700/50 px-1.5 py-0.5 rounded">V2.4.7</span>
                </div>
               <div class="text-[8px] md:text-[11px] flex gap-x-4 opacity-95 uppercase items-center">
                 <p>24K: <span id="display24K" class="font-medium">--</span></p>
                 <p>22K: <span id="display22K" class="font-medium">--</span></p>
                 <p>21K: <span id="display21K" class="font-medium">--</span></p>
             </div>
          </div>
            
            <div class="flex items-center gap-2 md:gap-4 scale-90 md:scale-100">
              <select id="currencySelector" onchange="changeCurrency()" class="bg-yellow-800/40 text-white text-[10px] font-bold border border-yellow-500/20 rounded-lg h-8 px-1">
                  <option value="USD">USD</option>
                  <option value="QAR">QAR</option>
                  <option value="JOD">JOD</option>
                  <option value="EUR">EUR</option>
              </select>
               <div class="relative bg-yellow-800/40 p-1 rounded-lg flex w-24 h-8 items-center cursor-pointer border border-yellow-500/20" onclick="toggleTheme()">
                 <div class="theme-slider-bg absolute top-0.5 left-0.5 bottom-0.5 w-[calc(50%-2px)] bg-white dark:bg-gray-800 rounded shadow-sm transition-transform duration-300"></div>
                 <div class="relative flex-1 text-center text-[8px] font-bold z-10 text-black dark:text-white dark:opacity-40">LITE</div>
                 <div class="relative flex-1 text-center text-[8px] font-bold z-10 text-white opacity-40 dark:opacity-100">DARK</div>
             </div>
               <div class="flex items-center gap-2 bg-yellow-800/40 px-2 h-8 rounded-lg border border-yellow-500/20 no-pdf">
                  <span id="lastUpdateLabel" class="text-white font-black text-[9px] uppercase">...</span>
                  <div id="liveIndicator" class="w-2 h-2 rounded-full bg-red-500 shadow-sm"></div>
              </div>
            </div>
        </header>
 
        <!-- Mobile Grid Fix: 2 cols on mobile, 5 on desktop -->
        <div id="statsContainer" class="grid grid-cols-2 md:grid-cols-5 bg-white dark:bg-gray-800 p-2 md:p-4 gap-2 border-b text-center shrink-0">
            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg border dark:border-gray-600">
                <p class="text-[8px] text-gray-500 uppercase font-bold">Purchases</p>
                <p id="statCount" class="text-sm md:text-xl font-black">0</p>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg border dark:border-gray-600">
                <p class="text-[8px] text-gray-500 uppercase font-bold">Weight</p>
                <p id="statGrams" class="text-sm md:text-xl font-black">0.00g</p>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg border dark:border-gray-600 col-span-2 md:col-span-1">
                <p class="text-[8px] text-gray-500 uppercase font-bold">Invested</p>
                <p id="statInvested" class="text-sm md:text-xl font-black">--</p>
            </div>
            <div id="cardProfit" class="p-2 rounded-lg border bg-gray-50 dark:bg-gray-700">
                <p class="text-[8px] uppercase font-bold opacity-70">Net Profit</p>
                <p id="statProfit" class="text-sm md:text-xl font-black">--</p>
            </div>
            <div id="cardValue" class="p-2 rounded-lg border bg-gray-50 dark:bg-gray-700">
                <p class="text-[8px] uppercase font-bold opacity-70">Market Value</p>
                <p id="statValue" class="text-sm md:text-xl font-black">--</p>
            </div>
        </div>
 
        <!-- Chart Scroll for Mobile -->
        <div id="chartsContainer" class="grid grid-cols-1 lg:grid-cols-3 bg-white dark:bg-gray-800 p-2 md:p-4 gap-4 border-b shrink-0 overflow-x-auto custom-scrollbar">
           <div class="flex flex-col min-w-[280px]">
                <h2 class="text-[10px] font-bold uppercase mb-1">Wallet Growth</h2>
                <div style="height: 120px;"><canvas id="walletBehaviorChart"></canvas></div>
          </div>
            <div class="lg:border-l dark:border-gray-700 lg:px-4 min-w-[280px]">
                <h2 class="text-[10px] font-bold uppercase mb-1">Weight Breakdown</h2>
                <div style="height: 120px;"><canvas id="weightBarChart"></canvas></div>
          </div>
            <div class="lg:border-l dark:border-gray-700 lg:pl-4 min-w-[280px]">
                <h2 class="text-[10px] font-bold uppercase mb-1">Market Price</h2>
                <div id="tradingview_widget" class="tv-widget-container" style="height: 120px;"></div>
          </div>
        </div>
 
        <!-- Scrollable Transaction Section -->
        <div class="bg-white dark:bg-gray-800 flex-grow overflow-hidden flex flex-col">
            <div class="overflow-y-auto custom-scrollbar flex-grow" id="tableContainer">
             <table class="w-full text-left border-collapse text-[10px]" id="reportTable">
                 <thead class="bg-gray-100 dark:bg-gray-700 font-bold sticky top-0 z-10">
                     <tr>
                         <th class="p-2 border-b dark:border-gray-600">Date</th>
                         <th class="p-2 border-b dark:border-gray-600 text-center">Type</th>
                         <th class="p-2 border-b dark:border-gray-600 text-center">Weight</th>
                         <th class="p-2 border-b dark:border-gray-600 text-right">Profit</th>
                         <th class="p-2 border-b dark:border-gray-600 text-center no-pdf">Actions</th>
                     </tr>
                 </thead>
                 <tbody id="goldTable" class="dark:text-gray-300"></tbody>
             </table>
          </div>
        </div>

        <!-- Inputs Section for mobile -->
        <div class="bg-gray-50 dark:bg-gray-800 border-t p-2 md:p-4 shrink-0 no-pdf">
            <div class="grid grid-cols-3 md:grid-cols-6 gap-1.5">
                <input type="date" id="purchaseDate" class="border dark:border-gray-600 p-1 rounded text-[10px] dark:bg-gray-700 h-8">
                <select id="purity" class="border dark:border-gray-600 p-1 rounded text-[10px] dark:bg-gray-700 h-8">
                    <option value="24">24K</option>
                    <option value="22">22K</option>
                    <option value="21">21K</option>
                </select>
                <input type="number" id="grams" placeholder="Grams" class="border dark:border-gray-600 p-1 rounded text-[10px] dark:bg-gray-700 h-8">
                <input type="number" id="price" placeholder="Price" class="border dark:border-gray-600 p-1 rounded text-[10px] dark:bg-gray-700 h-8">
                <input type="number" id="costs" placeholder="Making" class="border dark:border-gray-600 p-1 rounded text-[10px] dark:bg-gray-700 h-8">
                <button onclick="addEntry()" class="bg-yellow-600 text-white rounded font-bold h-8 text-[10px] uppercase">Add</button>
            </div>
        </div>
    </div>
 
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const DB_URL = "https://samirgoldwallet-default-rtdb.firebaseio.com/entries.json";
        const SOURCE_URL = "https://www.livepriceofgold.com/Qatar-gold-price.html";
        let exchangeRates = { QAR: 1, JOD: 0.1947, USD: 0.2747, EUR: 0.2588 };
        let currentCurrency = 'USD';
        let currentPrices = { k24: 0, k22: 0, k21: 0 };
        let lastKnownPrice = 0;
        let walletChart, barChart, cachedEntries = null, isEditingLocked = false;
 
        window.onload = function() {
            const loaderBar = document.getElementById('loaderBar');
            const passArea = document.getElementById('passwordArea');
            const loaderTitle = document.getElementById('loaderTitle');
            const pContainer = document.getElementById('pContainer');
            setTimeout(() => { loaderBar.style.width = '100%'; }, 50);
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
               document.documentElement.classList.add('dark');
            }
            document.getElementById('purchaseDate').valueAsDate = new Date();
            initCharts(); loadTradingView(); fetchEntries(); fetchLiveRates(); fetchGoldFlow();
            setInterval(fetchGoldFlow, 60000); startExchangeStream(); 
            setTimeout(() => {
                loaderTitle.innerText = "ACCESS SECURED";
                pContainer.style.display = "none";
                passArea.style.display = "flex";
                document.getElementById('passInput').focus();
            }, 4000);
        };

        function checkPass(val) {
            if(val === "siakaiba") {
                document.getElementById('loadingScreen').style.display = 'none';
            } else if (val.length >= 8) {
                document.getElementById('passError').classList.remove('hidden');
            }
        }

        function loadTradingView() {
            const isDark = document.documentElement.classList.contains('dark');
            new TradingView.widget({
                "autosize": true, "symbol": "OANDA:XAUUSD", "interval": "240", "timezone": "Etc/UTC",
                "theme": isDark ? "dark" : "light", "style": "2", "locale": "en", "hide_top_toolbar": true,
                "hide_legend": true, "save_image": false, "container_id": "tradingview_widget"
            });
        }

        async function fetchGoldFlow() {
            const indicator = document.getElementById('liveIndicator');
            const timeLabel = document.getElementById('lastUpdateLabel');
            let successFlag = false;
            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(SOURCE_URL)}&ts=${Date.now()}`);
                const data = await response.json();
                if (data.contents && parseMarketHTML(data.contents)) successFlag = true;
            } catch(e) {
                try {
                    const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(SOURCE_URL)}`);
                    const html = await response.text();
                    if (html && parseMarketHTML(html)) successFlag = true;
                } catch(err) {}
            }
            if (successFlag) {
                indicator.classList.add('bg-green-500', 'status-flash');
                timeLabel.innerText = "Live";
            } else {
                indicator.classList.add('bg-red-500');
                timeLabel.innerText = "Offline";
            }
        }

        function parseMarketHTML(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const rows = Array.from(doc.querySelectorAll('tr'));
            let dataFound = false;
            rows.forEach(row => {
                const txt = row.innerText.toUpperCase();
                if (txt.includes('24K') && txt.includes('GRAM')) { const price = extractPrice(row.innerText); if (price > 100) { currentPrices.k24 = price; dataFound = true; } }
                if (txt.includes('22K') && txt.includes('GRAM')) { const price = extractPrice(row.innerText); if (price > 100) currentPrices.k22 = price; }
                if (txt.includes('21K') && txt.includes('GRAM')) { const price = extractPrice(row.innerText); if (price > 100) currentPrices.k21 = price; }
            });
            if (dataFound) {
                if (currentPrices.k22 === 0) currentPrices.k22 = +(currentPrices.k24 * 0.9166).toFixed(2);
                if (currentPrices.k21 === 0) currentPrices.k21 = +(currentPrices.k24 * 0.875).toFixed(2);
                updatePriceUI();
                return true;
            }
            return false;
        }

        function extractPrice(str) { const match = str.match(/(\d{3}[\.,]\d{2})/); return match ? parseFloat(match[0].replace(',', '.')) : 0; }

        function updatePriceUI() {
            const diff = lastKnownPrice === 0 ? 0 : currentPrices.k24 - lastKnownPrice;
            lastKnownPrice = currentPrices.k24;
            updatePriceDisplay(diff);
            if(cachedEntries && !isEditingLocked) renderTable(cachedEntries);
        }

        function renderTable(data) { 
            const tb = document.getElementById('goldTable'); tb.innerHTML = ''; 
            if (!data) { updateStats(0, 0, 0, 0); return; } 
            const en = Object.keys(data).map(k => ({ id: k, ...data[k] })); en.sort((a, b) => a.timestamp - b.timestamp); 
            const w = { 24: 0, 22: 0, 21: 0 }; let cv = 0, tg = 0, ti = 0, cl = [], cd = []; const rate = exchangeRates[currentCurrency];
            en.forEach(e => { 
                const ref = currentPrices.k24 || 325;
                const lv = Math.round(e.grams * (ref * (e.purity / 24))); w[e.purity] += e.grams; tg += e.grams; ti += e.totalCost; cv += lv; cl.push(e.dateStr); cd.push(cv * rate); 
            }); 
            walletChart.data.labels = cl; walletChart.data.datasets[0].data = cd; walletChart.update('none'); 
            barChart.data.datasets[0].data = [w[24], w[22], w[21]]; barChart.update('none'); 
            [...en].reverse().forEach(e => { 
                const ref = currentPrices.k24 || 325;
                const lv = Math.round(e.grams * (ref * (e.purity / 24))), pq = lv - e.totalCost; 
                tb.innerHTML += `<tr id="row-${e.id}" class="border-b dark:border-gray-700">
                    <td class="p-2 font-bold">${e.dateStr}</td>
                    <td class="p-2 text-center text-yellow-600 font-bold">${e.purity}K</td>
                    <td class="p-2 text-center font-bold">${e.grams}g</td>
                    <td class="p-2 text-right font-bold ${pq >= 0 ? 'text-green-500' : 'text-red-500'}">${formatCurrency(pq)}</td>
                    <td class="p-2 text-center no-pdf">
                        <button class="text-red-400" onclick="deleteEntry('${e.id}')">Del</button>
                    </td>
                </tr>`; 
            }); 
            updateStats(en.length, tg, Math.round(ti), cv); 
        }

        function initCharts() { 
            const commonOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } };
            walletChart = new Chart(document.getElementById('walletBehaviorChart').getContext('2d'), { 
                type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#ca8a04', backgroundColor: 'rgba(202, 138, 4, 0.1)', fill: true, tension: 0.3 }] }, 
                options: commonOptions 
            }); 
            barChart = new Chart(document.getElementById('weightBarChart').getContext('2d'), { 
                type: 'bar', data: { labels: ['24', '22', '21'], datasets: [{ data: [0, 0, 0], backgroundColor: '#ca8a04' }] }, 
                options: commonOptions 
            }); 
        }

        async function fetchLiveRates() { try { const res = await fetch('https://open.er-api.com/v6/latest/QAR'); const data = await res.json(); if(data?.rates) { exchangeRates.JOD = data.rates.JOD; exchangeRates.USD = data.rates.USD; exchangeRates.EUR = data.rates.EUR; } } catch (e) {} }
        function formatCurrency(val) { const rate = exchangeRates[currentCurrency]; return (val * rate).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
        function changeCurrency() { currentCurrency = document.getElementById('currencySelector').value; if(cachedEntries) renderTable(cachedEntries); }
        function updatePriceDisplay(c) { 
            const e24 = document.getElementById('display24K'), e22 = document.getElementById('display22K'), e21 = document.getElementById('display21K'); 
            if(!e24 || currentPrices.k24 === 0) return;
            e24.innerText = formatCurrency(currentPrices.k24); e22.innerText = formatCurrency(currentPrices.k22); e21.innerText = formatCurrency(currentPrices.k21); 
        }
        function startExchangeStream() { setInterval(() => { if (currentCurrency !== 'QAR') { exchangeRates[currentCurrency] *= (1 + (Math.random() * 0.0001 - 0.00005)); updatePriceDisplay(0); if(cachedEntries && !isEditingLocked) renderTable(cachedEntries); } }, 10000); }
        async function fetchEntries() { const r = await fetch(DB_URL); const d = await r.json(); cachedEntries = d; renderTable(d); }
        async function addEntry() { 
            const rd = document.getElementById('purchaseDate').value, p = parseInt(document.getElementById('purity').value), g = parseFloat(document.getElementById('grams').value) || 0, up = parseFloat(document.getElementById('price').value) || 0, um = parseFloat(document.getElementById('costs').value) || 0; 
            if(!rd || g <= 0) return; 
            const e = { timestamp: new Date(rd).getTime(), dateStr: new Date(rd).toLocaleDateString('en-GB'), purity: p, grams: g, totalCost: g * (up + um) }; 
            await fetch(DB_URL, { method: 'POST', body: JSON.stringify(e) }); fetchEntries(); 
        }
        function updateStats(c, g, i, v) { 
            const p = v - i, dk = document.documentElement.classList.contains('dark'); 
            document.getElementById('statCount').innerText = c; document.getElementById('statGrams').innerText = g.toFixed(1) + 'g'; 
            document.getElementById('statInvested').innerText = formatCurrency(i); document.getElementById('statValue').innerText = formatCurrency(v); document.getElementById('statProfit').innerText = formatCurrency(p); 
        }
        async function deleteEntry(id) { if(confirm("Delete?")) { await fetch(`${DB_URL.replace('.json', '')}/${id}.json`, { method: 'DELETE' }); fetchEntries(); } }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light'; loadTradingView(); fetchEntries(); }
    </script>
</body>
</html>
